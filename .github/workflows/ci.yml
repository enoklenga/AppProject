name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lef_timesheet_test
          POSTGRES_USER: lef_timesheet
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lef_timesheet -d lef_timesheet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lef_timesheet_test
      POSTGRES_USER: lef_timesheet
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      API_NUM_PROXIES: "0"
      API_TRUST_X_FORWARDED_FOR: "False"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python manage.py check
      # Blocca le PR con modelli modificati ma migrazioni mancanti.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 1
