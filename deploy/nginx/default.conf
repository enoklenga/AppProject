map $http_origin $forwarded_origin {
    default $http_origin;
    "null" "";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location = /health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location = /health/ready/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 1d;
    }

    # I documenti riservati non vengono mai serviti direttamente da Nginx.
    location /private_media/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $forwarded_origin;

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}