[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lef-timesheet"
version = "0.1.0"
description = "Sistema web LEF per la gestione dei timesheet dei consulenti esterni."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django>=5.2.16,<5.3",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "gunicorn>=23,<24",
    "djangorestframework>=3.17,<3.18",
    "django-filter>=26.1,<27",
    "drf-spectacular>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
