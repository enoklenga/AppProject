{% extends "base.html" %}
{% block title %}Cambio password | LEFTRACK{% endblock %}
{% block content %}
<div class="page-header"><div><div class="eyebrow">Account</div><h1>Cambio password</h1></div></div>
<section class="panel form-panel">
<form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions"><button class="button button-primary" type="submit"><svg class="btn-icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>Aggiorna password</button></div>
</form>
</section>
{% endblock %}
