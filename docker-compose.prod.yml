name: lef-timesheet-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  init_permissions:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    user: "0:0"
    command: >
      sh -c "mkdir -p /app/staticfiles /app/media /app/private_media &&
      chown -R 10001:10001 /app/staticfiles /app/media /app/private_media"
    volumes:
      - static_prod_data:/app/staticfiles
      - media_prod_data:/app/media
      - private_media_prod_data:/app/private_media
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-3}
      --timeout $${GUNICORN_TIMEOUT:-60}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    volumes:
      - static_prod_data:/app/staticfiles
      - media_prod_data:/app/media
      - private_media_prod_data:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      init_permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 45s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  reminder:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      sh -c "
      while true;
      do
        python manage.py invia_promemoria_timesheet;
        python manage.py generate_task_notifications;
        sleep 3600;
      done"
    depends_on:
      web:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_prod_data:/static:ro
      - media_prod_data:/media:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_prod_data:
  static_prod_data:
  media_prod_data:
  private_media_prod_data:
